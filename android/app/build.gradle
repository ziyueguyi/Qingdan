plugins { id 'com.android.application'; id 'com.chaquo.python' }

android {
    namespace 'com.ziyueguyi.qingdan'
    compileSdk 37
    defaultConfig {
        applicationId 'com.ziyueguyi.qingdan'
        minSdk 24
        targetSdk 37
        versionCode 30000
        versionName '0.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    flavorDimensions 'architecture'
    productFlavors {
        arm64 { dimension 'architecture'; ndk { abiFilters 'arm64-v8a' } }
        emulator { dimension 'architecture'; ndk { abiFilters 'x86_64' } }
    }
    signingConfigs {
        if (System.getenv('ANDROID_KEYSTORE_PATH')) {
            release {
                storeType 'PKCS12'
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    sourceSets.main.assets.srcDirs += ['build/generated/assets']
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
chaquopy {
    defaultConfig {
        version = '3.13'
        pip { install 'httpx==0.28.1'; install 'urllib3>=2.2.2'; install 'typing_extensions>=4.6' }
    }
    sourceSets.main.srcDir 'build/generated/python'
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.core:core:1.15.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
