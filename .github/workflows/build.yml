name: build-windows-exe

# push / tag 后在 GitHub 上从 git 源码构建 Windows exe 并做体积门禁，产物作为 artifact 下载。
# 本地复现同一链路：pyinstaller packaging/qingdan.spec + scripts/check_size.py。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: x64

      - uses: actions/setup-node@v4
        with:
          node-version: "22"          # 前端语法守卫（node --check）需要 node

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Tests
        run: python -m pytest -q -p no:cacheprovider --junitxml=buildtmp/test-results.xml

      - name: Build exe (onedir)
        run: python -m PyInstaller --noconfirm packaging/qingdan.spec

      - name: Size gate (42 MB)
        run: python scripts/check_size.py dist/Qingdan

      - name: Verify frozen exe and CLI
        run: python scripts/verify_release.py dist/Qingdan

      - name: Package download
        id: package
        run: |
          $version = python -c "from qingdan import __version__; print(__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT
          $shortSha = '${{ github.sha }}'.Substring(0, 7)
          $name = "Qingdan-$version-windows-x64-$shortSha.zip"
          Compress-Archive -Path dist/Qingdan -DestinationPath "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content "dist/$name.sha256" -Encoding utf8
          "### Windows build $version" >> $env:GITHUB_STEP_SUMMARY
          "Download the ZIP in Artifacts, extract the whole Qingdan folder, then run Qingdan.exe. QingdanCLI.exe is included." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qingdan-windows-x64
          path: |
            dist/Qingdan-*.zip
            dist/Qingdan-*.sha256
            dist/SIZE.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: buildtmp/test-results.xml
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    env:
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install latest stable Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --version
          set +o pipefail
          yes | "$sdkmanager" --licenses > /dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$sdkmanager" 'platform-tools' 'platforms;android-37' 'build-tools;37.0.0'
      - name: Prepare shared Android runtime
        run: |
          python -m pip install 'dulwich==1.2.21'
          python scripts/prepare_android.py
      - name: Load persistent signing identity
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qingdan-release.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/qingdan-release.p12" >> "$GITHUB_ENV"
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo 'Signing secrets absent; only an unsigned validation APK will be produced.'
          fi
      - name: Build phone and emulator APKs
        working-directory: android
        run: gradle assembleArm64Release assembleEmulatorDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify offline Android app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android && gradle connectedEmulatorDebugAndroidTest --stacktrace
      - name: Package Android download
        run: |
          mkdir -p android-download
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          apk=$(find android/app/build/outputs/apk/arm64/release -name '*.apk' | head -1)
          suffix=''
          if [[ '${{ steps.signing.outputs.signed }}' != true ]]; then suffix='-unsigned'; fi
          name="Qingdan-$version-android-arm64$suffix.apk"
          cp "$apk" "android-download/$name"
          (cd android-download && sha256sum "$name" > "$name.sha256")
          if [[ '${{ steps.signing.outputs.signed }}' == true ]]; then
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "android-download/$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Qingdan-android-arm64
          path: android-download/*
          if-no-files-found: error
      - name: Android test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          if-no-files-found: ignore

  release:
    needs: [build, android]
    concurrency:
      group: release-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    if: needs.android.outputs.signed == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Qingdan-*
          path: release-files
          merge-multiple: true

      - name: Publish version to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version"; exit 1; }
          tag="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF#refs/tags/}" != "$tag" ]]; then
            echo "Tag must match the application version: $tag"
            exit 1
          fi
          if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == false ]]; then
              echo "Release $tag already published. Bump the application version for a new release."
              exit 0
            fi
          else
            printf '%s\n' 'Windows x64 与 Android 64 位版本。' '' 'Windows：下载 windows-x64 ZIP，解压后保留整个 Qingdan 文件夹，运行 Qingdan.exe。Android：下载 android-arm64 APK，在手机安装。' '' '支持可配置时间的定时增量同步。安卓后台执行可能因省电或断网延后。SHA-256 校验文件一并提供；Source code 是源码，不是运行包。' > release-notes.md
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "清单 $VERSION" --notes-file release-notes.md --draft
          fi
          gh release upload "$tag" release-files/*.zip release-files/*.apk release-files/*.sha256 release-files/SIZE.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest

