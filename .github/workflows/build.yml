name: build-windows-exe

# push / tag 后在 GitHub 上从 git 源码构建 Windows exe 并做体积门禁，产物作为 artifact 下载。
# 本地复现同一链路：pyinstaller packaging/qingdan.spec + scripts/check_size.py。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: x64

      - uses: actions/setup-node@v4
        with:
          node-version: "22"          # 前端语法守卫（node --check）需要 node

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Tests
        run: python -m pytest -q -p no:cacheprovider --junitxml=buildtmp/test-results.xml

      - name: Build exe (onedir)
        run: python -m PyInstaller --noconfirm packaging/qingdan.spec

      - name: Size gate (42 MB)
        run: python scripts/check_size.py dist/Qingdan

      - name: Verify frozen exe and CLI
        run: python scripts/verify_release.py dist/Qingdan

      - name: Package download
        run: |
          $version = python -c "from qingdan import __version__; print(__version__)"
          $shortSha = '${{ github.sha }}'.Substring(0, 7)
          $name = "Qingdan-$version-windows-x64-$shortSha.zip"
          Compress-Archive -Path dist/Qingdan -DestinationPath "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content "dist/$name.sha256" -Encoding utf8
          "### Windows build $version" >> $env:GITHUB_STEP_SUMMARY
          "Download the ZIP in Artifacts, extract the whole Qingdan folder, then run Qingdan.exe. QingdanCLI.exe is included." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qingdan-windows-x64
          path: |
            dist/Qingdan-*.zip
            dist/Qingdan-*.sha256
            dist/SIZE.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: buildtmp/test-results.xml
          if-no-files-found: ignore
