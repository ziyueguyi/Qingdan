[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qingdan"
version = "0.4.0"
description = "本地优先的任务清单，Gitee 私有仓库同步"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.160",
    "uvicorn>=0.54",
    "httpx>=0.28",
    "dulwich>=1.2",
    "pywebview>=6.2",
    "pythonnet>=3.2",
    "pystray>=0.19.5",
    "Pillow>=13.0",
    "winotify>=1.1.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pyinstaller>=6.22"]

[project.scripts]
qingdan = "qingdan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
